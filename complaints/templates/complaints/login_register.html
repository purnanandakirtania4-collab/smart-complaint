<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Smart Complaint</title>{% include "complaints/base_style.html" %}<style>
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);padding:34px}.logo{width:72px;height:72px;border-radius:20px;background:#dbeafe;display:grid;place-items:center;font-size:35px;margin:0 auto 16px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f5f9;border-radius:11px;padding:4px;margin:20px 0}.tab{padding:10px;text-align:center;border:0;background:transparent;border-radius:8px;font-weight:700;color:#64748b;cursor:pointer}.tab.active{background:#fff;color:#1d4ed8;box-shadow:0 2px 8px rgba(0,0,0,.08)}h1{text-align:center;color:#172554}.subtitle{text-align:center;margin:8px 0 22px}
</style></head><body><div class="auth"><div class="card auth-card">
<div class="logo">🛡️</div><h1>Smart Complaint</h1><p class="subtitle muted">Login or create your user account</p>
{% if messages %}{% for message in messages %}<div class="message {% if message.tags == 'success' %}success{% endif %}">{{ message }}</div>{% endfor %}{% endif %}
<div class="tabs"><button class="tab active" id="loginTab" onclick="showLogin()">Login</button><button class="tab" id="registerTab" onclick="showRegister()">Register</button></div>
<div id="loginPanel"><form method="post" action="{% url 'login' %}">{% csrf_token %}<div class="form-group"><label class="label">Username</label><input class="input" name="username" required autocomplete="username"></div><div class="form-group"><label class="label">Password</label><input class="input" type="password" name="password" required autocomplete="current-password"></div><button class="btn btn-primary" style="width:100%">🔐 Login</button></form></div>
<div id="registerPanel" style="display:none"><form method="post" action="{% url 'register' %}">{% csrf_token %}<div class="form-group"><label class="label">Username</label><input class="input" name="username" required></div><div class="form-group"><label class="label">Email</label><input class="input" type="email" name="email" required></div><div class="form-group"><label class="label">Password</label><input class="input" type="password" name="password" minlength="6" required></div><button class="btn btn-primary" style="width:100%">Create Account</button></form></div>
<div style="text-align:center;margin-top:22px"><a href="{% url 'worker_login' %}" style="color:#1d4ed8;font-weight:700">👷 Worker Login</a></div>
</div></div><script>
function showLogin(){loginPanel.style.display='block';registerPanel.style.display='none';loginTab.classList.add('active');registerTab.classList.remove('active')}
function showRegister(){loginPanel.style.display='none';registerPanel.style.display='block';loginTab.classList.remove('active');registerTab.classList.add('active')}
</script></body></html>
