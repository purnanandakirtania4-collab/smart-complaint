<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Registration | Smart Complaint</title>{% include "complaints/base_style.html" %}<style>.box{max-width:560px;margin:30px auto;padding:35px}.head{text-align:center}.icon{width:78px;height:78px;border-radius:20px;background:#dbeafe;display:grid;place-items:center;font-size:38px;margin:auto}.head h1{margin:14px 0 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.box{padding:25px 18px}.grid{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="card box"><div class="head"><div class="icon">👷</div><h1>Worker Registration</h1><p class="muted">Create your worker account and profile.</p></div>{% if messages %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endif %}<form method="post" style="margin-top:25px">{% csrf_token %}<div class="grid"><div class="form-group"><label class="label">Full Name</label><input class="input" name="name" required></div><div class="form-group"><label class="label">Username</label><input class="input" name="username" required></div><div class="form-group"><label class="label">Email</label><input class="input" type="email" name="email" required></div><div class="form-group"><label class="label">Mobile Number</label><input class="input" type="tel" name="phone" maxlength="15" required></div></div><div class="form-group"><label class="label">Experience</label><select class="select" name="experience" required><option value="">Select experience</option>{% for value,label in choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}<option value="1 Month">1 Month</option><option value="2 Months">2 Months</option><option value="3 Months">3 Months</option><option value="6 Months">6 Months</option><option value="1 Year">1 Year</option><option value="2 Years">2 Years</option><option value="3 Years">3 Years</option><option value="4 Years">4 Years</option><option value="5 Years">5 Years</option><option value="More than 5 Years">More than 5 Years</option></select></div><div class="form-group"><label class="label">Password</label><input class="input" type="password" name="password" minlength="6" required></div><button class="btn btn-primary" style="width:100%">Create Worker Account</button></form><div style="text-align:center;margin-top:20px"><a href="{% url 'worker_login' %}" style="color:#2563eb;font-weight:800">Already registered? Worker Login</a></div></div></main></body></html>
