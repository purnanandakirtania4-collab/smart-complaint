<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover.0" />

    <title>Password Changed | Smart Complaint</title>

    {% include 'complaints/base_style.html' %}

    <style>
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        min-height: 100vh;
      }
      
      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      
      .card {
        width: 100%;
        max-width: 470px;
        padding: 38px 30px;
        border-radius: 26px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
      }
      
      .icon {
        width: 74px;
        height: 74px;
        margin: 0 auto 20px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 35px;
        background: rgba(16, 185, 129, 0.13);
      }
      
      h1 {
        margin: 0;
        color: #0f172a;
        font-size: 28px;
      }
      
      p {
        margin: 14px auto 0;
        max-width: 380px;
        color: #64748b;
        font-size: 14px;
        line-height: 1.7;
      }
      
      .login-button {
        display: inline-block;
        margin-top: 26px;
        padding: 14px 28px;
        border-radius: 14px;
        color: #ffffff;
        font-weight: 800;
        text-decoration: none;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.24);
      }
      
      body.sc-theme-dark .card {
        background: rgba(15, 23, 42, 0.94);
        border-color: rgba(148, 163, 184, 0.18);
      }
      
      body.sc-theme-dark h1,
      body.sc-theme-glass h1 {
        color: #ffffff;
      }
      
      body.sc-theme-dark p,
      body.sc-theme-glass p {
        color: #cbd5e1;
      }
      
      body.sc-theme-glass .card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(59, 130, 246, 0.08));
        border: 1px solid rgba(191, 219, 254, 0.25);
        box-shadow: 0 30px 70px rgba(2, 6, 23, 0.38);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
    </style>
  </head>

  <body>
    <div class="page">
      <div class="card">
        <div class="icon"></div>

        <h1>Password Changed</h1>

        <p>Your Smart Complaint password has been changed successfully. You can now sign in using your new password.</p>

        <a href="{% url 'login' %}" class="login-button">Login Now</a>
      </div>
    </div>
  </body>
</html>
