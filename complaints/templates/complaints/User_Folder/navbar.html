{% load static %}

<style>
  .hn-svg{
    width:21px;
    height:21px;
    display:block;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .hn-menu-btn{
    position:fixed;
    top:calc(14px + env(safe-area-inset-top,0px));
    left:14px;
    z-index:1900;
    width:44px;
    height:44px;
    border:1px solid rgba(255,255,255,.65);
    border-radius:14px;
    background:rgba(255,255,255,.96);
    color:#153e75;
    display:grid;
    place-items:center;
    box-shadow:0 9px 24px rgba(15,23,42,.18);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .hn-menu-btn .hn-svg{
    width:24px;
    height:24px;
  }

  .hn-overlay{
    position:fixed;
    inset:0;
    z-index:1940;
    background:rgba(15,23,42,.48);
    opacity:0;
    visibility:hidden;
    transition:.25s ease;
  }

  .hn-overlay.open{
    opacity:1;
    visibility:visible;
  }

  .hn-drawer{
    position:fixed;
    inset:0 auto 0 0;
    z-index:1950;
    width:min(300px,88vw);
    display:flex;
    flex-direction:column;
    transform:translateX(-105%);
    transition:transform .28s ease;
    background:#fff;
    color:#172554;
    box-shadow:18px 0 44px rgba(15,23,42,.24);
    overflow-y:auto;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .hn-drawer.open{
    transform:translateX(0);
  }

  .hn-head{
    padding:calc(18px + env(safe-area-inset-top,0px)) 16px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid #e2e8f0;
    background:linear-gradient(135deg,#eff6ff,#eef2ff);
  }

  .hn-brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }

  .hn-brand-logo{
    width:40px;
    height:40px;
    flex:0 0 40px;
    display:grid;
    place-items:center;
    border-radius:13px;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:#fff;
    box-shadow:0 7px 18px rgba(37,99,235,.22);
  }

  .hn-brand-copy{
    min-width:0;
  }

  .hn-brand-copy strong{
    display:block;
    color:#172554;
    font-size:14px;
    font-weight:950;
    white-space:nowrap;
  }

  .hn-brand-copy small{
    display:block;
    margin-top:2px;
    color:#64748b;
    font-size:9px;
    font-weight:700;
  }

  .hn-close{
    width:36px;
    height:36px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#475569;
    display:grid;
    place-items:center;
    cursor:pointer;
  }

  .hn-user{
    margin:13px;
    padding:13px;
    display:grid;
    grid-template-columns:46px minmax(0,1fr);
    gap:11px;
    align-items:center;
    border:1px solid #dbeafe;
    border-radius:16px;
    background:#f8fbff;
  }

  .hn-avatar{
    width:46px;
    height:46px;
    overflow:hidden;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#dbeafe;
    color:#1d4ed8;
  }

  .hn-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .hn-avatar .hn-svg{
    width:23px;
    height:23px;
  }

  .hn-user-copy{
    min-width:0;
  }

  .hn-user-copy strong{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#172554;
    font-size:12px;
    font-weight:950;
  }

  .hn-user-copy small{
    display:block;
    margin-top:3px;
    color:#64748b;
    font-size:9px;
    font-weight:800;
  }

  .hn-links{
    padding:0 12px 18px;
    display:grid;
    gap:7px;
  }

  .hn-link{
    min-height:48px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid transparent;
    border-radius:13px;
    color:#526178;
    background:transparent;
    text-decoration:none;
    font-size:12px;
    font-weight:850;
    transition:.18s ease;
  }

  .hn-link:hover,
  .hn-link.active{
    background:#eef4ff;
    border-color:#dbeafe;
    color:#1d4ed8;
    transform:translateX(2px);
  }

  .hn-iconbox{
    width:30px;
    min-width:30px;
    display:grid;
    place-items:center;
  }

  .hn-premium{
    background:linear-gradient(135deg,#fff8dc,#fff3c4);
    border-color:#fde68a;
    color:#92400e;
  }

  .hn-premium:hover{
    background:#ffefb0;
    border-color:#fbbf24;
    color:#78350f;
  }

  .hn-logout{
    color:#dc2626;
  }

  .hn-logout:hover{
    background:#fff1f2;
    border-color:#fecdd3;
    color:#be123c;
  }

  @media(max-width:600px){
    .hn-menu-btn{
      top:calc(10px + env(safe-area-inset-top,0px));
      left:10px;
      width:42px;
      height:42px;
    }
  }
</style>


<button
  type="button"
  class="hn-menu-btn"
  id="hnMenuBtn"
  aria-label="Open navigation"
  aria-controls="hnDrawer"
  aria-expanded="false"
>
  <svg class="hn-svg" viewBox="0 0 24 24">
    <path d="M4 7h16"></path>
    <path d="M4 12h16"></path>
    <path d="M4 17h16"></path>
  </svg>
</button>


<div class="hn-overlay" id="hnOverlay"></div>


<aside class="hn-drawer" id="hnDrawer" aria-label="Home navigation">

  <div class="hn-head">

    <div class="hn-brand">

      <span class="hn-brand-logo">
        <svg class="hn-svg" viewBox="0 0 24 24">
          <path d="M12 3 20 6v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6Z"></path>
          <path d="m8.5 12 2.2 2.2L15.8 9"></path>
        </svg>
      </span>

      <span class="hn-brand-copy">
        <strong>Smart Complaint</strong>
        <small>Citizen Menu</small>
      </span>

    </div>


    <button
      type="button"
      class="hn-close"
      id="hnClose"
      aria-label="Close navigation"
    >
      <svg class="hn-svg" viewBox="0 0 24 24">
        <path d="M6 6l12 12"></path>
        <path d="M18 6 6 18"></path>
      </svg>
    </button>

  </div>


  <div class="hn-user">

    <span class="hn-avatar">

      {% if request.user.user_profile.photo %}

        <img
          src="{{ request.user.user_profile.photo.url }}"
          alt="{{ request.user.username }}"
        >

      {% else %}

        <svg class="hn-svg" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
        </svg>

      {% endif %}

    </span>


    <span class="hn-user-copy">

      <strong>
        {{ request.user.get_full_name|default:request.user.username }}
      </strong>

      <small>
        CMP ID: CMP-{{ request.user.id|stringformat:"05d" }}
      </small>

    </span>

  </div>


  <nav class="hn-links">

    <!-- PROFILE -->

    <a class="hn-link" href="{% url 'profile' %}">
      <span class="hn-iconbox">
        <svg class="hn-svg" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
        </svg>
      </span>

      <span>Profile</span>
    </a>


    <!-- NOTIFICATIONS -->

    <a class="hn-link" href="{% url 'notifications' %}">
      <span class="hn-iconbox">
        <svg class="hn-svg" viewBox="0 0 24 24">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
          <path d="M10 21h4"></path>
        </svg>
      </span>

      <span>Notifications</span>
    </a>


    <!-- PAYMENT -->

    <a class="hn-link" href="{% url 'user_payment_details' %}">
      <span class="hn-iconbox">
        <svg class="hn-svg" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="M3 10h18"></path>
          <path d="M7 15h4"></path>
        </svg>
      </span>

      <span>Payment Details</span>
    </a>


    <!-- SETTINGS -->

    <a class="hn-link" href="{% url 'user_settings' %}">
      <span class="hn-iconbox">
        <svg class="hn-svg" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>

          <path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A8 8 0 0 0 15 6l-.3-2.6h-4L10.4 6A8 8 0 0 0 8.9 7L6.5 6l-2 3.4 2 1.5a7 7 0 0 0 0 2.1l-2 1.5 2 3.4 2.4-1A8 8 0 0 0 10.4 18l.3 2.6h4L15 18a8 8 0 0 0 1.5-1.1l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1Z"></path>
        </svg>
      </span>

      <span>Settings</span>
    </a>


    <!-- PREMIUM -->

    <a
      class="hn-link hn-premium"
      href="{% url 'citizen_premium' %}"
    >
      <span class="hn-iconbox">
        <svg class="hn-svg" viewBox="0 0 24 24">
          <path d="M5 16 3 7l5 3 4-6 4 6 5-3-2 9H5Z"></path>
          <path d="M5 19h14"></path>
        </svg>
      </span>

      <span>Purchase Premium</span>
    </a>


    <!-- LOGOUT -->

    <a
      class="hn-link hn-logout"
      href="{% url 'logout' %}"
    >
      <span class="hn-iconbox">
        <svg class="hn-svg" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <path d="M16 17l5-5-5-5"></path>
          <path d="M21 12H9"></path>
        </svg>
      </span>

      <span>Logout</span>
    </a>

  </nav>

</aside>


<script>
(function(){

  const btn = document.getElementById('hnMenuBtn');
  const drawer = document.getElementById('hnDrawer');
  const overlay = document.getElementById('hnOverlay');
  const close = document.getElementById('hnClose');

  if(!btn || !drawer || !overlay || !close){
    return;
  }

  function setOpen(open){

    drawer.classList.toggle('open', open);
    overlay.classList.toggle('open', open);

    btn.setAttribute(
      'aria-expanded',
      open ? 'true' : 'false'
    );

    document.body.style.overflow = open ? 'hidden' : '';
  }


  btn.addEventListener('click', function(){
    setOpen(true);
  });


  close.addEventListener('click', function(){
    setOpen(false);
  });


  overlay.addEventListener('click', function(){
    setOpen(false);
  });


  document.addEventListener('keydown', function(e){

    if(e.key === 'Escape'){
      setOpen(false);
    }

  });

})();
</script>
