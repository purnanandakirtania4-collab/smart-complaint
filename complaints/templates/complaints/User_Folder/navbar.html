{% load static %}

<!-- =========================================
     SMART COMPLAINT SLIDE MENU
========================================= -->

<style>
    /* MENU BUTTON */

    .sc-menu-button {
        position: fixed;
        top: 16px;
        left: 16px;

        width: 46px;
        height: 46px;

        border: none;
        border-radius: 13px;

        background: #ffffff;
        color: #1e3a8a;

        font-size: 25px;
        font-weight: bold;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        z-index: 950;

        box-shadow: 0 5px 18px rgba(15, 23, 42, 0.18);
    }

    /* DARK OVERLAY */

    .sc-sidebar-overlay {
        position: fixed;
        inset: 0;

        background: rgba(15, 23, 42, 0.50);

        opacity: 0;
        visibility: hidden;

        transition: 0.3s ease;

        z-index: 998;
    }

    .sc-sidebar-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    /* SIDEBAR */

    .sc-sidebar {
        position: fixed;

        top: 0;
        left: 0;

        width: 285px;
        max-width: 85vw;

        height: 100vh;

        background: #ffffff;

        transform: translateX(-105%);

        transition:
            transform 0.32s ease,
            background 0.3s ease;

        z-index: 999;

        display: flex;
        flex-direction: column;

        box-shadow: 10px 0 30px rgba(15, 23, 42, 0.20);

        overflow-y: auto;
    }

    .sc-sidebar.open {
        transform: translateX(0);
    }

    /* SIDEBAR HEADER */

    .sc-sidebar-header {
        padding: 22px 18px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        border-bottom: 1px solid #e2e8f0;
    }

    .sc-sidebar-title {
        display: flex;
        align-items: center;
        gap: 10px;

        color: #172554;

        font-size: 19px;
        font-weight: 800;
    }

    .sc-sidebar-logo {
        width: 40px;
        height: 40px;

        border-radius: 12px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(
            135deg,
            #4f46e5,
            #2563eb
        );

        color: white;

        font-size: 20px;
    }

    .sc-close-button {
        width: 36px;
        height: 36px;

        border: none;
        border-radius: 10px;

        background: #f1f5f9;

        color: #475569;

        font-size: 22px;

        cursor: pointer;
    }

    /* USER INFO */

    .sc-user-box {
        padding: 20px 18px;

        display: flex;
        align-items: center;
        gap: 12px;

        border-bottom: 1px solid #f1f5f9;
    }

    .sc-avatar {
        width: 48px;
        height: 48px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #dbeafe;

        font-size: 22px;
    }

    .sc-user-name {
        color: #172554;

        font-weight: 800;

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .sc-user-type {
        margin-top: 3px;

        color: #64748b;

        font-size: 12px;
    }

    /* MENU LINKS */

    .sc-menu {
        flex: 1;

        padding: 14px;

        display: flex;
        flex-direction: column;

        gap: 6px;
    }

    .sc-menu-link {
        min-height: 50px;

        padding: 12px 14px;

        border-radius: 12px;

        display: flex;
        align-items: center;
        gap: 14px;

        text-decoration: none;

        color: #64748b;

        font-size: 15px;
        font-weight: 700;

        transition: 0.2s ease;
    }

    .sc-menu-link:hover {
        background: #eef2ff;
        color: #4338ca;

        transform: translateX(3px);
    }

    .sc-menu-icon {
        width: 28px;

        text-align: center;

        font-size: 20px;
    }

    .sc-notification-text {
        flex: 1;
    }

    .sc-notification-badge {
        min-width: 24px;
        height: 24px;

        padding: 0 7px;

        border-radius: 999px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        background: #dc2626;
        color: #ffffff;

        font-size: 12px;
        font-weight: 800;
    }

    /* LOGOUT */

    .sc-logout {
        color: #dc2626;
    }

    .sc-logout:hover {
        color: #dc2626;
        background: #fee2e2;
    }

    /* DARK MODE ROW */

    .sc-theme-row {
        min-height: 54px;

        padding: 10px 14px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        color: #64748b;

        font-size: 15px;
        font-weight: 700;
    }

    .sc-theme-label {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    /* TOGGLE */

    .sc-switch {
        position: relative;

        width: 48px;
        height: 27px;
    }

    .sc-switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .sc-slider {
        position: absolute;

        inset: 0;

        cursor: pointer;

        border-radius: 30px;

        background: #cbd5e1;

        transition: 0.3s;
    }

    .sc-slider::before {
        content: "";

        position: absolute;

        width: 21px;
        height: 21px;

        left: 3px;
        top: 3px;

        border-radius: 50%;

        background: #ffffff;

        transition: 0.3s;

        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.20);
    }

    .sc-switch input:checked + .sc-slider {
        background: #4f46e5;
    }

    .sc-switch input:checked + .sc-slider::before {
        transform: translateX(21px);
    }

    /* =========================================
       DARK MODE
    ========================================= */

    body.dark-mode {
        background: #0f172a !important;
        color: #e2e8f0;
    }

    body.dark-mode .sc-menu-button {
        background: #1e293b;
        color: #ffffff;
    }

    body.dark-mode .sc-sidebar {
        background: #111827;
    }

    body.dark-mode .sc-sidebar-header,
    body.dark-mode .sc-user-box {
        border-color: #263247;
    }

    body.dark-mode .sc-sidebar-title,
    body.dark-mode .sc-user-name {
        color: #f8fafc;
    }

    body.dark-mode .sc-user-type {
        color: #94a3b8;
    }

    body.dark-mode .sc-close-button {
        background: #1e293b;
        color: #ffffff;
    }

    body.dark-mode .sc-menu-link {
        color: #cbd5e1;
    }

    body.dark-mode .sc-menu-link:hover {
        background: #312e81;
        color: #ffffff;
    }

    body.dark-mode .sc-theme-row {
        color: #cbd5e1;
    }

    body.dark-mode .sc-logout {
        color: #fca5a5;
    }

    body.dark-mode .sc-logout:hover {
        background: #451a1a;
        color: #fecaca;
    }

    @media (max-width: 700px) {
        .sc-menu-button {
            top: 12px;
            left: 12px;

            width: 43px;
            height: 43px;
        }
    }
</style>


<!-- HAMBURGER -->

<button
    type="button"
    class="sc-menu-button"
    id="scMenuButton"
    aria-label="Open menu"
>
    ☰
</button>


<!-- OVERLAY -->

<div
    class="sc-sidebar-overlay"
    id="scSidebarOverlay"
></div>


<!-- SIDEBAR -->

<aside
    class="sc-sidebar"
    id="scSidebar"
>

    <div class="sc-sidebar-header">

        <div class="sc-sidebar-title">

            <div class="sc-sidebar-logo">
                🛡️
            </div>

            <span>
                Menu
            </span>

        </div>

        <button
            type="button"
            class="sc-close-button"
            id="scCloseButton"
        >
            ×
        </button>

    </div>


    <!-- USER -->

    <div class="sc-user-box">

        <div class="sc-avatar">
            👤
        </div>

        <div>

            <div class="sc-user-name">
                {{ request.user.username }}
            </div>

            <div class="sc-user-type">
                User Account
            </div>

        </div>

    </div>


    <!-- MENU -->

    <nav class="sc-menu">

        <!-- PROFILE -->

        <a
            href="{% url 'profile' %}"
            class="sc-menu-link"
        >
            <span class="sc-menu-icon">
                👤
            </span>

            <span>
                Profile
            </span>
        </a>


        <!-- MY COMPLAINTS -->

        <a
            href="{% url 'my_complaints' %}"
            class="sc-menu-link"
        >
            <span class="sc-menu-icon">
                📋
            </span>

            <span>
                My Complaints
            </span>
        </a>


        <!-- NOTIFICATIONS -->

        <a
            href="{% url 'notifications' %}"
            class="sc-menu-link"
        >
            <span class="sc-menu-icon">
                🔔
            </span>

            <span class="sc-notification-text">
                Notifications
            </span>

            {% if unread_notification_count %}
                <span class="sc-notification-badge">
                    {{ unread_notification_count }}
                </span>
            {% endif %}
        </a>


        <!-- SETTINGS -->

        <a
            href="{% url 'user_settings' %}"
            class="sc-menu-link"
        >
            <span class="sc-menu-icon">
                ⚙️
            </span>

            <span>
                Settings
            </span>
        </a>


        <!-- DARK MODE -->

        <div class="sc-theme-row">

            <div class="sc-theme-label">

                <span class="sc-menu-icon">
                    🌙
                </span>

                <span>
                    Dark Mode
                </span>

            </div>

            <label class="sc-switch">

                <input
                    type="checkbox"
                    id="scDarkModeToggle"
                >

                <span class="sc-slider"></span>

            </label>

        </div>


        <!-- LOGOUT -->

        <a
            href="{% url 'logout' %}"
            class="sc-menu-link sc-logout"
        >
            <span class="sc-menu-icon">
                🚪
            </span>

            <span>
                Logout
            </span>
        </a>

    </nav>

</aside>


<script>
    const scSidebar =
        document.getElementById("scSidebar");

    const scOverlay =
        document.getElementById("scSidebarOverlay");

    const scMenuButton =
        document.getElementById("scMenuButton");

    const scCloseButton =
        document.getElementById("scCloseButton");

    const scDarkModeToggle =
        document.getElementById("scDarkModeToggle");


    /* OPEN MENU */

    function openScSidebar() {

        scSidebar.classList.add("open");

        scOverlay.classList.add("active");

        document.body.style.overflow = "hidden";
    }


    /* CLOSE MENU */

    function closeScSidebar() {

        scSidebar.classList.remove("open");

        scOverlay.classList.remove("active");

        document.body.style.overflow = "";
    }


    scMenuButton.addEventListener(
        "click",
        openScSidebar
    );


    scCloseButton.addEventListener(
        "click",
        closeScSidebar
    );


    scOverlay.addEventListener(
        "click",
        closeScSidebar
    );


    /* =========================================
       DARK MODE
    ========================================= */

    const savedTheme =
        localStorage.getItem(
            "smartComplaintTheme"
        );


    if (savedTheme === "dark") {

        document.body.classList.add(
            "dark-mode"
        );

        scDarkModeToggle.checked = true;
    }


    scDarkModeToggle.addEventListener(
        "change",
        function () {

            if (this.checked) {

                document.body.classList.add(
                    "dark-mode"
                );

                localStorage.setItem(
                    "smartComplaintTheme",
                    "dark"
                );

            } else {

                document.body.classList.remove(
                    "dark-mode"
                );

                localStorage.setItem(
                    "smartComplaintTheme",
                    "light"
                );
            }
        }
    );


    /* =========================================
       SWIPE
    ========================================= */

    let scTouchStartX = 0;
    let scTouchEndX = 0;


    document.addEventListener(
        "touchstart",
        function (event) {

            scTouchStartX =
                event.changedTouches[0].screenX;
        },
        {
            passive: true
        }
    );


    document.addEventListener(
        "touchend",
        function (event) {

            scTouchEndX =
                event.changedTouches[0].screenX;

            const distance =
                scTouchEndX - scTouchStartX;


            /* LEFT EDGE → SWIPE RIGHT */

            if (
                scTouchStartX < 45 &&
                distance > 70 &&
                !scSidebar.classList.contains("open")
            ) {

                openScSidebar();
            }


            /* SIDEBAR OPEN → SWIPE LEFT */

            if (
                scSidebar.classList.contains("open") &&
                distance < -70
            ) {

                closeScSidebar();
            }
        },
        {
            passive: true
        }
    );
</script>
