<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complaint Submitted | Smart Complaint</title>{% include "complaints/base_style.html" %}<style>.success-card{max-width:620px;margin:80px auto;padding:40px;text-align:center}.check{width:90px;height:90px;border-radius:50%;background:#dcfce7;color:#166534;display:grid;place-items:center;font-size:45px;margin:auto}.tracking{margin:20px 0;background:#eff6ff;color:#1d4ed8;padding:16px;border-radius:12px;font-size:20px;font-weight:900}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
</style></head><body><main class="page"><div class="card success-card"><div class="check">✓</div><h1 style="margin:18px 0 8px">Complaint Submitted</h1><p class="muted">Your complaint has been recorded successfully.</p>{% if complaint %}<div class="tracking">Tracking ID: {{ complaint.tracking_id }}</div><p class="muted">Save this Tracking ID to check your complaint status.</p>{% endif %}<div class="actions"><a class="btn btn-primary" href="{% url 'check_status' %}">🔎 Check Status</a><a class="btn btn-light" href="{% url 'submit_complaint' %}">📝 Submit Another</a><a class="btn btn-dark" href="{% url 'home' %}">Home</a></div></div></main></body></html>
