{% load static %}

{% url 'home' as bn_home_url %}
{% url 'my_complaints' as bn_complaint_url %}
{% url 'submit_complaint' as bn_submit_url %}

<style>
  /* =========================================================
       RESET FOR BOTTOM NAVBAR
    ========================================================= */
  
  .bn-navbar,
  .bn-navbar * {
    box-sizing: border-box;
  }
  
  /* =========================================================
       MAIN NAVBAR
    ========================================================= */
  
  .bn-navbar {
    position: fixed;
  
    left: 0;
    right: 0;
    bottom: 0;
  
    z-index: 9999;
  
    width: 100%;
    height: 84px;
  
    padding-bottom: env(safe-area-inset-bottom, 0px);
  
    background: #67a9ef;
  
    border-radius: 18px 18px 0 0;
  
    box-shadow: 0 -3px 16px rgba(15, 23, 42, 0.14);
  
    display: grid;
  
    grid-template-columns: repeat(5, minmax(0, 1fr));
  
    align-items: center;
  
    pointer-events: auto;
  }
  
  /* =========================================================
       NAV ITEM
    ========================================================= */
  
  .bn-item {
    position: relative;
  
    z-index: 2;
  
    height: 100%;
  
    display: flex;
  
    flex-direction: column;
  
    align-items: center;
    justify-content: center;
  
    gap: 5px;
  
    color: #082f63;
  
    text-decoration: none;
  
    font-size: 10px;
  
    font-weight: 800;
  
    cursor: pointer;
  
    pointer-events: auto;
  
    -webkit-tap-highlight-color: transparent;
  
    transition: transform 0.18s ease, color 0.18s ease, opacity 0.18s ease;
  }
  
  .bn-item:hover {
    color: #062c5e;
  }
  
  .bn-item:active {
    transform: scale(0.96);
  }
  
  /* =========================================================
       ICON
    ========================================================= */
  
  .bn-icon {
    width: 25px;
    height: 25px;
  
    display: block;
  
    fill: none;
  
    stroke: currentColor;
  
    stroke-width: 2;
  
    stroke-linecap: round;
  
    stroke-linejoin: round;
  
    pointer-events: none;
  }
  
  /* =========================================================
       LABEL
    ========================================================= */
  
  .bn-label {
    line-height: 1;
  
    white-space: nowrap;
  
    pointer-events: none;
  }
  
  /* =========================================================
       CENTER SUBMIT BUTTON
    ========================================================= */
  
  .bn-submit {
    justify-content: flex-start;
  
    padding-top: 47px;
  }
  
  .bn-submit-circle {
    position: absolute;
  
    top: -18px;
    left: 50%;
  
    transform: translateX(-50%);
  
    width: 64px;
    height: 64px;
  
    border-radius: 50%;
  
    background: #8fc1f5;
  
    border: 4px solid #0d3769;
  
    display: grid;
  
    place-items: center;
  
    box-shadow: 0 5px 10px rgba(15, 23, 42, 0.18);
  
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  
    pointer-events: none;
  }
  
  .bn-submit:hover .bn-submit-circle {
    transform: translateX(-50%) translateY(-2px);
  
    box-shadow: 0 8px 15px rgba(15, 23, 42, 0.22);
  }
  
  .bn-submit-circle::before {
    content: '';
  
    position: absolute;
  
    inset: -9px;
  
    border-radius: 50%;
  
    z-index: -1;
  
    background: #67a9ef;
  }
  
  .bn-submit-circle .bn-icon {
    width: 29px;
    height: 29px;
  }
  
  .bn-submit .bn-label {
    margin-top: -2px;
  }
  
  /* =========================================================
       ACTIVE ITEM
    ========================================================= */
  
  .bn-item.active {
    color: #062c5e;
  }
  
  .bn-item.active::after {
    content: '';
  
    position: absolute;
  
    bottom: 6px;
  
    width: 5px;
    height: 5px;
  
    border-radius: 50%;
  
    background: currentColor;
  }
  
  .bn-submit.active::after {
    bottom: 5px;
  }
  
  /* =========================================================
       COMING SOON ITEMS
    ========================================================= */
  
  .bn-coming-soon {
    position: relative;
  }
  
  .bn-coming-soon::before {
    content: '';
  
    position: absolute;
  
    top: 13px;
    right: 22%;
  
    width: 6px;
    height: 6px;
  
    border-radius: 50%;
  
    background: #ffffff;
  
    box-shadow: 0 0 7px rgba(255, 255, 255, 0.9);
  
    animation: bnComingPulse 1.8s ease-in-out infinite;
  
    pointer-events: none;
  }
  
  @keyframes bnComingPulse {
    0%,
    100% {
      opacity: 0.45;
      transform: scale(0.85);
    }
  
    50% {
      opacity: 1;
      transform: scale(1.15);
    }
  }
  
  /* =========================================================
       MOBILE
    ========================================================= */
  
  @media (max-width: 600px) {
    .bn-navbar {
      height: 84px;
  
      border-radius: 17px 17px 0 0;
    }
  
    .bn-item {
      font-size: 9px;
    }
  
    .bn-icon {
      width: 22px;
      height: 22px;
    }
  
    .bn-submit-circle {
      width: 62px;
      height: 62px;
  
      top: -16px;
    }
  
    .bn-coming-soon::before {
      top: 14px;
      right: 18%;
    }
  }
</style>

<nav class="bn-navbar" aria-label="Bottom navigation">
  <!--  =====================================================
       HOME
  ======================================================  -->

  <a href="{{ bn_home_url }}" class="bn-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
    <svg class="bn-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 11 12 3l9 8"></path>

      <path d="M5 10v10h14V10"></path>

      <path d="M9 20v-6h6v6"></path>
    </svg>

    <span class="bn-label">Home</span>
  </a>

  <!--  =====================================================
       MY COMPLAINT
  ======================================================  -->

  <a href="{{ bn_complaint_url }}" class="bn-item {% if request.resolver_match.url_name == 'my_complaints' %}active{% endif %}">
    <svg class="bn-icon" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="5" y="3" width="14" height="18" rx="2"></rect>

      <path d="M9 8h6"></path>

      <path d="M9 12h6"></path>

      <path d="M9 16h4"></path>
    </svg>

    <span class="bn-label">My Complaint</span>
  </a>

  <!--  =====================================================
       SUBMIT
  ======================================================  -->

  <a href="{{ bn_submit_url }}" class="bn-item bn-submit {% if request.resolver_match.url_name == 'submit_complaint' %}active{% endif %}">
    <span class="bn-submit-circle">
      <svg class="bn-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5v14"></path>

        <path d="M5 12h14"></path>
      </svg>
    </span>

    <span class="bn-label">Submit</span>
  </a>

  <!--  =====================================================
       BUY
       COMING SOON
  ======================================================  -->

  <a href="{% url 'coming_soon' %}" class="bn-item bn-coming-soon {% if request.resolver_match.url_name == 'coming_soon' %}active{% endif %}" aria-label="Buy - Coming Soon">
    <svg class="bn-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 8h12l1 13H5L6 8Z"></path>

      <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>

      <path d="M9 12h.01"></path>

      <path d="M15 12h.01"></path>
    </svg>

    <span class="bn-label">Buy</span>
  </a>

  <!--  =====================================================
       BUSINESS
       COMING SOON
  ======================================================  -->

  <a href="{% url 'coming_soon' %}" class="bn-item bn-coming-soon {% if request.resolver_match.url_name == 'coming_soon' %}active{% endif %}" aria-label="Business - Coming Soon">
    <svg class="bn-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 21V8l8-5 8 5v13"></path>

      <path d="M8 21v-6h8v6"></path>

      <path d="M8 10h2"></path>

      <path d="M14 10h2"></path>
    </svg>

    <span class="bn-label">Business</span>
  </a>
</nav>
