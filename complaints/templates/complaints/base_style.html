<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: Inter, Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
    color: #172554;
  }
  a {
    text-decoration: none;
  }
  .page {
    width: min(1100px, calc(100% - 32px));
    margin: 0 auto;
    padding: 32px 0;
  }
  .card {
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 22px 55px rgba(0, 0, 0, 0.22);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 11px;
    padding: 12px 18px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn:hover {
    transform: translateY(-2px);
  }
  .btn-primary {
    background: #2563eb;
    color: #fff;
  }
  .btn-dark {
    background: #0f172a;
    color: #fff;
  }
  .btn-light {
    background: #eff6ff;
    color: #1d4ed8;
  }
  .btn-danger {
    background: #fee2e2;
    color: #b91c1c;
  }
  .input,
  .textarea,
  .select {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 11px;
    outline: 0;
    font-size: 15px;
    background: #fff;
  }
  .input:focus,
  .textarea:focus,
  .select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
  }
  .textarea {
    min-height: 140px;
    resize: vertical;
  }
  .label {
    display: block;
    margin: 0 0 7px;
    font-weight: 700;
    color: #334155;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .message {
    padding: 13px 15px;
    border-radius: 11px;
    margin-bottom: 14px;
    background: #fee2e2;
    color: #991b1b;
  }
  .message.success {
    background: #dcfce7;
    color: #166534;
  }
  .muted {
    color: #64748b;
    line-height: 1.6;
  }
  @media (max-width: 650px) {
    .page {
      width: min(100% - 20px, 1100px);
      padding: 20px 0;
    }
  }
</style>
