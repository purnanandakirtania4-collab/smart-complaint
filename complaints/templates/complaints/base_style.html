<style>

</style>


<script>
    /*
        Global Theme Loader

        This makes saved themes work even on pages
        where navbar is not present.
    */

    (function () {

        const colorMap = {
            blue: {
                primary: "37, 99, 235",
                secondary: "14, 165, 233"
            },

            indigo: {
                primary: "79, 70, 229",
                secondary: "99, 102, 241"
            },

            teal: {
                primary: "13, 148, 136",
                secondary: "6, 182, 212"
            },

            purple: {
                primary: "124, 58, 237",
                secondary: "168, 85, 247"
            },

            slate: {
                primary: "71, 85, 105",
                secondary: "100, 116, 139"
            }
        };


        function applyGlobalColor(colorName) {

            const selected =
                colorMap[colorName] ||
                colorMap.blue;


            document.documentElement.style.setProperty(
                "--app-primary-rgb",
                selected.primary
            );


            document.documentElement.style.setProperty(
                "--app-secondary-rgb",
                selected.secondary
            );
        }


        function applySavedTheme() {

            if (!document.body) {
                return;
            }


            const workerTheme =
                localStorage.getItem(
                    "workerThemeV2"
                );


            const userTheme =
                localStorage.getItem(
                    "smartComplaintThemeV2"
                );


            const workerColor =
                localStorage.getItem(
                    "workerGlassColorV2"
                );


            const userColor =
                localStorage.getItem(
                    "smartComplaintGlassColor"
                );


            const isWorkerPage =
                document.body.classList.contains(
                    "worker-page"
                );


            let theme;
            let color;


            if (isWorkerPage) {

                theme =
                    workerTheme ||
                    "light";

                color =
                    workerColor ||
                    "blue";

            } else {

                theme =
                    userTheme ||
                    "light";

                color =
                    userColor ||
                    "blue";
            }


            applyGlobalColor(
                color
            );


            if (isWorkerPage) {

                document.body.classList.remove(
                    "worker-theme-light",
                    "worker-theme-dark",
                    "worker-theme-glass",
                    "worker-dark-mode"
                );


                document.body.classList.add(
                    "worker-theme-" + theme
                );

            } else {

                document.body.classList.remove(
                    "sc-theme-light",
                    "sc-theme-dark",
                    "sc-theme-glass",
                    "dark-mode"
                );


                document.body.classList.add(
                    "sc-theme-" + theme
                );
            }
        }


        if (
            document.readyState === "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                applySavedTheme
            );

        } else {

            applySavedTheme();
        }


        window.SmartComplaintTheme = {
            applySavedTheme:
                applySavedTheme,

            applyGlobalColor:
                applyGlobalColor
        };

    })();
</script>
