<style>
    /* =====================================================
       SMART COMPLAINT - GLOBAL THEME SYSTEM
       Light / Dark / Glass
    ===================================================== */

    :root {
        --app-primary-rgb: 37, 99, 235;
        --app-secondary-rgb: 59, 130, 246;

        --app-primary: #2563eb;
        --app-secondary: #3b82f6;

        --app-text: #172554;
        --app-muted: #64748b;

        --app-card-bg: #ffffff;
        --app-card-border: #e2e8f0;

        --app-input-bg: #ffffff;
        --app-input-border: #cbd5e1;

        --app-radius: 20px;

        --app-shadow:
            0 20px 50px
            rgba(15, 23, 42, 0.14);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        min-height: 100%;
    }

    body {
        min-height: 100vh;

        font-family:
            Inter,
            Arial,
            sans-serif;

        background:
            linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #2563eb
            );

        background-attachment: fixed;

        color: var(--app-text);

        transition:
            background 0.35s ease,
            color 0.35s ease;
    }

    a {
        text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
        font-family: inherit;
    }

    /* =====================================================
       PAGE
    ===================================================== */

    .page {
        width:
            min(
                1100px,
                calc(100% - 32px)
            );

        margin: 0 auto;
        padding: 32px 0;
    }

    /* =====================================================
       CARD
    ===================================================== */

    .card {
        background: var(--app-card-bg);

        border:
            1px solid
            var(--app-card-border);

        border-radius:
            var(--app-radius);

        box-shadow:
            var(--app-shadow);

        transition:
            background 0.3s ease,
            border-color 0.3s ease,
            color 0.3s ease,
            box-shadow 0.3s ease;
    }

    /* =====================================================
       BUTTON
    ===================================================== */

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        gap: 8px;

        border: 0;
        border-radius: 11px;

        padding: 12px 18px;

        font-size: 14px;
        font-weight: 700;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease,
            border-color 0.2s ease,
            color 0.2s ease;
    }

    .btn:hover {
        transform: translateY(-2px);
    }

    .btn-primary {
        background:
            linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

        color: #ffffff;

        box-shadow:
            0 8px 22px
            rgba(37, 99, 235, 0.25);
    }

    .btn-dark {
        background: #0f172a;
        color: #ffffff;
    }

    .btn-light {
        background: #eff6ff;
        color: #1d4ed8;
    }

    .btn-danger {
        background: #fee2e2;
        color: #b91c1c;
    }

    /* =====================================================
       FORM
    ===================================================== */

    .input,
    .textarea,
    .select {
        width: 100%;

        padding: 13px 14px;

        border:
            1px solid
            var(--app-input-border);

        border-radius: 11px;

        outline: none;

        background:
            var(--app-input-bg);

        color:
            var(--app-text);

        font-size: 15px;

        transition:
            background 0.2s ease,
            color 0.2s ease,
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
        border-color: var(--app-primary);

        box-shadow:
            0 0 0 4px
            rgba(
                var(--app-primary-rgb),
                0.12
            );
    }

    .textarea {
        min-height: 140px;
        resize: vertical;
    }

    .label {
        display: block;

        margin-bottom: 7px;

        color: #334155;

        font-weight: 700;
    }

    .form-group {
        margin-bottom: 18px;
    }

    /* =====================================================
       MESSAGE
    ===================================================== */

    .message {
        padding: 13px 15px;

        margin-bottom: 14px;

        border-radius: 11px;

        background: #fee2e2;
        color: #991b1b;
    }

    .message.success {
        background: #dcfce7;
        color: #166534;
    }

    .muted {
        color: var(--app-muted);
        line-height: 1.6;
    }

    /* =====================================================
       LIGHT THEME
    ===================================================== */

    body.sc-theme-light,
    body.worker-theme-light {
        --app-text: #172554;
        --app-muted: #64748b;

        --app-card-bg: #ffffff;
        --app-card-border: #e2e8f0;

        --app-input-bg: #ffffff;
        --app-input-border: #cbd5e1;

        background:
            linear-gradient(
                135deg,
                #eff6ff,
                #e0e7ff,
                #f8fafc
            );

        color: #172554;
    }

    /* =====================================================
       DARK THEME
    ===================================================== */

    body.sc-theme-dark,
    body.worker-theme-dark,
    body.dark-mode,
    body.worker-dark-mode {
        --app-text: #e2e8f0;
        --app-muted: #94a3b8;

        --app-card-bg: #1e293b;
        --app-card-border: #334155;

        --app-input-bg: #0f172a;
        --app-input-border: #475569;

        background:
            linear-gradient(
                135deg,
                #020617,
                #0f172a,
                #172033
            ) !important;

        background-attachment: fixed !important;

        color: #e2e8f0 !important;
    }

    body.sc-theme-dark .card,
    body.worker-theme-dark .card,
    body.dark-mode .card,
    body.worker-dark-mode .card {
        background: #1e293b;
        border-color: #334155;

        color: #e2e8f0;
    }

    body.sc-theme-dark .label,
    body.worker-theme-dark .label,
    body.dark-mode .label,
    body.worker-dark-mode .label {
        color: #cbd5e1;
    }

    body.sc-theme-dark .muted,
    body.worker-theme-dark .muted,
    body.dark-mode .muted,
    body.worker-dark-mode .muted {
        color: #94a3b8 !important;
    }

    body.sc-theme-dark .input,
    body.sc-theme-dark .textarea,
    body.sc-theme-dark .select,
    body.worker-theme-dark .input,
    body.worker-theme-dark .textarea,
    body.worker-theme-dark .select {
        background: #0f172a;
        border-color: #475569;
        color: #ffffff;
    }

    /* =====================================================
       GLASS THEME
    ===================================================== */

    body.sc-theme-glass,
    body.worker-theme-glass {
        --app-text: #ffffff;

        --app-muted:
            rgba(
                226,
                232,
                240,
                0.82
            );

        --app-card-bg:
            rgba(
                30,
                58,
                95,
                0.48
            );

        --app-card-border:
            rgba(
                191,
                219,
                254,
                0.25
            );

        --app-input-bg:
            rgba(
                255,
                255,
                255,
                0.10
            );

        --app-input-border:
            rgba(
                255,
                255,
                255,
                0.20
            );

        background:
            radial-gradient(
                circle at 8% 16%,
                rgba(
                    var(--app-primary-rgb),
                    0.52
                ),
                transparent 30%
            ),

            radial-gradient(
                circle at 92% 74%,
                rgba(
                    var(--app-secondary-rgb),
                    0.36
                ),
                transparent 34%
            ),

            radial-gradient(
                circle at 54% 44%,
                rgba(
                    99,
                    102,
                    241,
                    0.20
                ),
                transparent 33%
            ),

            linear-gradient(
                135deg,
                #020617 0%,
                #082f49 36%,
                #172554 70%,
                #0f172a 100%
            ) !important;

        background-attachment: fixed !important;

        color: #ffffff !important;
    }

    /* =====================================================
       GLASS GLOBAL CARDS
    ===================================================== */

    body.sc-theme-glass .card,
    body.worker-theme-glass .card {
        background:
            linear-gradient(
                135deg,
                rgba(
                    255,
                    255,
                    255,
                    0.16
                ),
                rgba(
                    255,
                    255,
                    255,
                    0.065
                )
            ) !important;

        border:
            1px solid
            rgba(
                191,
                219,
                254,
                0.28
            ) !important;

        color: #ffffff !important;

        box-shadow:
            0 24px 60px
            rgba(
                2,
                6,
                23,
                0.32
            ),

            inset
            0 1px 0
            rgba(
                255,
                255,
                255,
                0.14
            );

        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
    }

    /* =====================================================
       GLASS HEADINGS
    ===================================================== */

    body.sc-theme-glass h1,
    body.sc-theme-glass h2,
    body.sc-theme-glass h3,
    body.sc-theme-glass h4,
    body.sc-theme-glass h5,
    body.sc-theme-glass h6,
    body.worker-theme-glass h1,
    body.worker-theme-glass h2,
    body.worker-theme-glass h3,
    body.worker-theme-glass h4,
    body.worker-theme-glass h5,
    body.worker-theme-glass h6 {
        color: #ffffff;
    }

    body.sc-theme-glass .muted,
    body.worker-theme-glass .muted {
        color:
            rgba(
                219,
                234,
                254,
                0.78
            ) !important;
    }

    body.sc-theme-glass .label,
    body.worker-theme-glass .label {
        color:
            rgba(
                255,
                255,
                255,
                0.90
            );
    }

    /* =====================================================
       GLASS INPUTS
    ===================================================== */

    body.sc-theme-glass .input,
    body.sc-theme-glass .textarea,
    body.sc-theme-glass .select,
    body.worker-theme-glass .input,
    body.worker-theme-glass .textarea,
    body.worker-theme-glass .select {
        background:
            rgba(
                255,
                255,
                255,
                0.10
            ) !important;

        border:
            1px solid
            rgba(
                255,
                255,
                255,
                0.20
            ) !important;

        color: #ffffff !important;

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    body.sc-theme-glass input::placeholder,
    body.sc-theme-glass textarea::placeholder,
    body.worker-theme-glass input::placeholder,
    body.worker-theme-glass textarea::placeholder {
        color:
            rgba(
                255,
                255,
                255,
                0.52
            );
    }

    body.sc-theme-glass select option,
    body.worker-theme-glass select option {
        background: #0f172a;
        color: #ffffff;
    }

    /* =====================================================
       GLASS BUTTONS
    ===================================================== */

    body.sc-theme-glass .btn-primary,
    body.worker-theme-glass .btn-primary {
        background:
            linear-gradient(
                135deg,
                rgba(
                    var(--app-primary-rgb),
                    0.95
                ),
                rgba(
                    var(--app-secondary-rgb),
                    0.88
                )
            ) !important;

        border:
            1px solid
            rgba(
                255,
                255,
                255,
                0.24
            ) !important;

        color: #ffffff !important;

        box-shadow:
            0 10px 28px
            rgba(
                var(--app-primary-rgb),
                0.30
            );
    }

    body.sc-theme-glass .btn-light,
    body.sc-theme-glass .btn-dark,
    body.worker-theme-glass .btn-light,
    body.worker-theme-glass .btn-dark {
        background:
            rgba(
                255,
                255,
                255,
                0.11
            ) !important;

        border:
            1px solid
            rgba(
                255,
                255,
                255,
                0.18
            ) !important;

        color: #ffffff !important;

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    body.sc-theme-glass .btn-danger,
    body.worker-theme-glass .btn-danger {
        background:
            rgba(
                220,
                38,
                38,
                0.20
            ) !important;

        border:
            1px solid
            rgba(
                248,
                113,
                113,
                0.28
            ) !important;

        color: #fecaca !important;
    }

    /* =====================================================
       GLOBAL GLASS SCROLLBAR
    ===================================================== */

    body.sc-theme-glass::-webkit-scrollbar,
    body.worker-theme-glass::-webkit-scrollbar {
        width: 9px;
    }

    body.sc-theme-glass::-webkit-scrollbar-track,
    body.worker-theme-glass::-webkit-scrollbar-track {
        background:
            rgba(
                15,
                23,
                42,
                0.40
            );
    }

    body.sc-theme-glass::-webkit-scrollbar-thumb,
    body.worker-theme-glass::-webkit-scrollbar-thumb {
        background:
            rgba(
                255,
                255,
                255,
                0.30
            );

        border-radius: 999px;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 650px) {
        .page {
            width:
                min(
                    calc(100% - 20px),
                    1100px
                );

            padding: 20px 0;
        }
    }

    /* =====================================================
       ACCESSIBILITY / CLARITY POLISH
       Keeps text, forms and cards readable in all 3 themes.
    ===================================================== */

    body.sc-theme-light,
    body.worker-theme-light {
        color-scheme: light;
    }

    body.sc-theme-dark,
    body.worker-theme-dark {
        color-scheme: dark;
    }

    body.sc-theme-glass,
    body.worker-theme-glass {
        color-scheme: dark;
    }

    body.sc-theme-light .theme-glass-surface,
    body.worker-theme-light .theme-glass-surface {
        background: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
        color: #172554 !important;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
    }

    body.sc-theme-dark .theme-glass-surface,
    body.worker-theme-dark .theme-glass-surface {
        background: #1e293b !important;
        border: 1px solid #334155 !important;
        color: #e2e8f0 !important;
        box-shadow: 0 22px 55px rgba(2, 6, 23, 0.34);
    }

    body.sc-theme-glass .theme-glass-surface,
    body.worker-theme-glass .theme-glass-surface {
        background:
            linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.15),
                rgba(59, 130, 246, 0.075)
            ) !important;
        border: 1px solid rgba(191, 219, 254, 0.28) !important;
        color: #ffffff !important;
        box-shadow:
            0 26px 65px rgba(2, 6, 23, 0.34),
            inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
    }

    body.sc-theme-light input,
    body.sc-theme-light select,
    body.sc-theme-light textarea,
    body.worker-theme-light input,
    body.worker-theme-light select,
    body.worker-theme-light textarea {
        color-scheme: light;
    }

    body.sc-theme-dark input,
    body.sc-theme-dark select,
    body.sc-theme-dark textarea,
    body.sc-theme-glass input,
    body.sc-theme-glass select,
    body.sc-theme-glass textarea,
    body.worker-theme-dark input,
    body.worker-theme-dark select,
    body.worker-theme-dark textarea,
    body.worker-theme-glass input,
    body.worker-theme-glass select,
    body.worker-theme-glass textarea {
        color-scheme: dark;
    }

    .theme-choice-bar {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin: 0 auto 18px;
    }

    .theme-choice-btn {
        min-width: 72px;
        padding: 8px 11px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(255, 255, 255, 0.86);
        color: #334155;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        transition: transform .2s ease, background .2s ease, color .2s ease;
    }

    .theme-choice-btn:hover {
        transform: translateY(-1px);
    }

    body.sc-theme-dark .theme-choice-btn,
    body.worker-theme-dark .theme-choice-btn {
        background: #1e293b;
        border-color: #475569;
        color: #e2e8f0;
    }

    body.sc-theme-glass .theme-choice-btn,
    body.worker-theme-glass .theme-choice-btn {
        background: rgba(255, 255, 255, 0.10);
        border-color: rgba(191, 219, 254, 0.24);
        color: #ffffff;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    @media (max-width: 650px) {
        body.sc-theme-glass,
        body.worker-theme-glass {
            background-attachment: scroll !important;
        }

        body.sc-theme-glass .card,
        body.worker-theme-glass .card,
        body.sc-theme-glass .theme-glass-surface,
        body.worker-theme-glass .theme-glass-surface {
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
    }



    /* =====================================================
       LIVE PREMIUM THEMES (shared by User + Worker)
       ===================================================== */
    body.sc-theme-royal, body.worker-theme-royal { --app-primary-rgb:124,58,237; --app-secondary-rgb:168,85,247; --theme-bg1:#160b2d; --theme-bg2:#25104a; --theme-bg3:#111827; }
    body.sc-theme-royalblue, body.worker-theme-royalblue { --app-primary-rgb:37,99,235; --app-secondary-rgb:99,102,241; --theme-bg1:#050b1d; --theme-bg2:#111f4d; --theme-bg3:#17134b; }
    body.sc-theme-emerald, body.worker-theme-emerald { --app-primary-rgb:16,185,129; --app-secondary-rgb:6,182,212; --theme-bg1:#031713; --theme-bg2:#06382d; --theme-bg3:#082b38; }
    body.sc-theme-rose, body.worker-theme-rose { --app-primary-rgb:225,29,72; --app-secondary-rgb:168,85,247; --theme-bg1:#1c0710; --theme-bg2:#4a1230; --theme-bg3:#2d123f; }
    body.sc-theme-sunset, body.worker-theme-sunset { --app-primary-rgb:249,115,22; --app-secondary-rgb:168,85,247; --theme-bg1:#431407; --theme-bg2:#7c2d12; --theme-bg3:#4c1d95; }
    body.sc-theme-cyber, body.worker-theme-cyber { --app-primary-rgb:34,211,238; --app-secondary-rgb:34,197,94; --theme-bg1:#020617; --theme-bg2:#083344; --theme-bg3:#14532d; }
    body.sc-theme-gold, body.worker-theme-gold { --app-primary-rgb:245,158,11; --app-secondary-rgb:250,204,21; --theme-bg1:#1c1917; --theme-bg2:#422006; --theme-bg3:#451a03; }
    body.sc-theme-slate, body.worker-theme-slate { --app-primary-rgb:56,189,248; --app-secondary-rgb:100,116,139; --theme-bg1:#0f172a; --theme-bg2:#1e293b; --theme-bg3:#111827; }

    body:is(.sc-theme-royal,.sc-theme-royalblue,.sc-theme-emerald,.sc-theme-rose,.sc-theme-sunset,.sc-theme-cyber,.sc-theme-gold,.sc-theme-slate,
             .worker-theme-royal,.worker-theme-royalblue,.worker-theme-emerald,.worker-theme-rose,.worker-theme-sunset,.worker-theme-cyber,.worker-theme-gold,.worker-theme-slate) {
        --app-text:#ffffff;
        --app-muted:rgba(226,232,240,.82);
        --app-card-bg:rgba(15,23,42,.58);
        --app-card-border:rgba(255,255,255,.18);
        --app-input-bg:rgba(255,255,255,.09);
        --app-input-border:rgba(255,255,255,.20);
        color-scheme:dark;
        color:#fff !important;
        background:
          radial-gradient(circle at 10% 12%, rgba(var(--app-primary-rgb),.48), transparent 31%),
          radial-gradient(circle at 90% 78%, rgba(var(--app-secondary-rgb),.30), transparent 35%),
          linear-gradient(135deg,var(--theme-bg1),var(--theme-bg2) 55%,var(--theme-bg3)) !important;
        background-attachment:fixed !important;
    }

    body:is(.sc-theme-royal,.sc-theme-royalblue,.sc-theme-emerald,.sc-theme-rose,.sc-theme-sunset,.sc-theme-cyber,.sc-theme-gold,.sc-theme-slate,
             .worker-theme-royal,.worker-theme-royalblue,.worker-theme-emerald,.worker-theme-rose,.worker-theme-sunset,.worker-theme-cyber,.worker-theme-gold,.worker-theme-slate)
      :is(.card,.theme-glass-surface) {
        background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.055)) !important;
        border:1px solid rgba(255,255,255,.18) !important;
        color:#fff !important;
        box-shadow:0 24px 60px rgba(2,6,23,.34), inset 0 1px 0 rgba(255,255,255,.10) !important;
        backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    }

    body:is(.sc-theme-royal,.sc-theme-royalblue,.sc-theme-emerald,.sc-theme-rose,.sc-theme-sunset,.sc-theme-cyber,.sc-theme-gold,.sc-theme-slate,
             .worker-theme-royal,.worker-theme-royalblue,.worker-theme-emerald,.worker-theme-rose,.worker-theme-sunset,.worker-theme-cyber,.worker-theme-gold,.worker-theme-slate)
      :is(h1,h2,h3,h4,h5,h6,.label) { color:#fff !important; }

    body:is(.sc-theme-royal,.sc-theme-royalblue,.sc-theme-emerald,.sc-theme-rose,.sc-theme-sunset,.sc-theme-cyber,.sc-theme-gold,.sc-theme-slate,
             .worker-theme-royal,.worker-theme-royalblue,.worker-theme-emerald,.worker-theme-rose,.worker-theme-sunset,.worker-theme-cyber,.worker-theme-gold,.worker-theme-slate)
      .muted { color:rgba(226,232,240,.78) !important; }

    body:is(.sc-theme-royal,.sc-theme-royalblue,.sc-theme-emerald,.sc-theme-rose,.sc-theme-sunset,.sc-theme-cyber,.sc-theme-gold,.sc-theme-slate,
             .worker-theme-royal,.worker-theme-royalblue,.worker-theme-emerald,.worker-theme-rose,.worker-theme-sunset,.worker-theme-cyber,.worker-theme-gold,.worker-theme-slate)
      :is(.input,.textarea,.select,input,select,textarea) {
        color-scheme:dark;
    }

    body:is(.sc-theme-royal,.sc-theme-royalblue,.sc-theme-emerald,.sc-theme-rose,.sc-theme-sunset,.sc-theme-cyber,.sc-theme-gold,.sc-theme-slate,
             .worker-theme-royal,.worker-theme-royalblue,.worker-theme-emerald,.worker-theme-rose,.worker-theme-sunset,.worker-theme-cyber,.worker-theme-gold,.worker-theme-slate)
      :is(.input,.textarea,.select) {
        background:rgba(255,255,255,.09) !important;
        border-color:rgba(255,255,255,.20) !important;
        color:#fff !important;
    }

    body:is(.sc-theme-royal,.sc-theme-royalblue,.sc-theme-emerald,.sc-theme-rose,.sc-theme-sunset,.sc-theme-cyber,.sc-theme-gold,.sc-theme-slate,
             .worker-theme-royal,.worker-theme-royalblue,.worker-theme-emerald,.worker-theme-rose,.worker-theme-sunset,.worker-theme-cyber,.worker-theme-gold,.worker-theme-slate)
      .btn-primary {
        background:linear-gradient(135deg,rgb(var(--app-primary-rgb)),rgb(var(--app-secondary-rgb))) !important;
        color:#fff !important;
        box-shadow:0 10px 28px rgba(var(--app-primary-rgb),.30);
    }

    body:is(.sc-theme-royal,.sc-theme-royalblue,.sc-theme-emerald,.sc-theme-rose,.sc-theme-sunset,.sc-theme-cyber,.sc-theme-gold,.sc-theme-slate,
             .worker-theme-royal,.worker-theme-royalblue,.worker-theme-emerald,.worker-theme-rose,.worker-theme-sunset,.worker-theme-cyber,.worker-theme-gold,.worker-theme-slate)
      .theme-choice-btn {
        background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.20); color:#fff;
        backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    }

    @media (max-width:650px) {
      body:is(.sc-theme-royal,.sc-theme-royalblue,.sc-theme-emerald,.sc-theme-rose,.sc-theme-sunset,.sc-theme-cyber,.sc-theme-gold,.sc-theme-slate,
               .worker-theme-royal,.worker-theme-royalblue,.worker-theme-emerald,.worker-theme-rose,.worker-theme-sunset,.worker-theme-cyber,.worker-theme-gold,.worker-theme-slate) {
        background-attachment:scroll !important;

</style>


<script>
(function () {
    "use strict";

    const THEMES = ["light","dark","glass","royal","royalblue","emerald","rose","sunset","cyber","gold","slate"];
    const FREE_THEMES = ["light","dark","glass"];
    const PREMIUM_THEMES = THEMES.filter(function (theme) { return !FREE_THEMES.includes(theme); });
    const USER_KEY = "smartComplaintThemeV2";
    const WORKER_KEY = "workerThemeV2";
    const USER_LEGACY_KEY = "smartComplaintLiveThemeV3";
    const WORKER_LEGACY_KEY = "workerLiveThemeV3";
    const USER_PREMIUM_KEY = "smartComplaintPremiumThemeAccessV1";
    const WORKER_PREMIUM_KEY = "workerPremiumThemeAccessV1";

    const colorMap = {
        blue:{primary:"37, 99, 235",secondary:"14, 165, 233"},
        indigo:{primary:"79, 70, 229",secondary:"99, 102, 241"},
        teal:{primary:"13, 148, 136",secondary:"6, 182, 212"},
        purple:{primary:"124, 58, 237",secondary:"168, 85, 247"},
        slate:{primary:"71, 85, 105",secondary:"100, 116, 139"}
    };

    function validTheme(theme) { return THEMES.includes(theme) ? theme : "light"; }
    function isPremiumTheme(theme) { return PREMIUM_THEMES.includes(validTheme(theme)); }
    function hasPremiumAccess(workerPage) {
        return localStorage.getItem(workerPage ? WORKER_PREMIUM_KEY : USER_PREMIUM_KEY) === "1";
    }
    function allowedTheme(theme, workerPage) {
        theme = validTheme(theme);
        return isPremiumTheme(theme) && !hasPremiumAccess(workerPage) ? "glass" : theme;
    }
    function setPremiumAccess(workerPage, enabled) {
        localStorage.setItem(workerPage ? WORKER_PREMIUM_KEY : USER_PREMIUM_KEY, enabled ? "1" : "0");
        const theme = allowedTheme(savedTheme(workerPage), workerPage);
        if (theme !== savedTheme(workerPage)) {
            localStorage.setItem(workerPage ? WORKER_KEY : USER_KEY, theme);
            localStorage.setItem(workerPage ? WORKER_LEGACY_KEY : USER_LEGACY_KEY, theme);
        }
        applyTheme(theme, workerPage);
        return enabled;
    }

    function applyGlobalColor(colorName) {
        const selected = colorMap[colorName] || colorMap.blue;
        document.documentElement.style.setProperty("--app-primary-rgb", selected.primary);
        document.documentElement.style.setProperty("--app-secondary-rgb", selected.secondary);
    }

    function clearThemeClasses() {
        if (!document.body) return;
        THEMES.forEach(function (theme) {
            document.body.classList.remove("sc-theme-" + theme, "worker-theme-" + theme);
        });
        document.body.classList.remove("dark-mode", "worker-dark-mode");
    }

    function applyTheme(theme, workerPage) {
        if (!document.body) return;
        theme = validTheme(theme);
        clearThemeClasses();
        document.body.classList.add((workerPage ? "worker-theme-" : "sc-theme-") + theme);
        document.dispatchEvent(new CustomEvent("smartComplaintThemeChanged", {detail:{theme:theme,workerPage:workerPage}}));
    }

    function savedTheme(workerPage) {
        const primaryKey = workerPage ? WORKER_KEY : USER_KEY;
        const legacyKey = workerPage ? WORKER_LEGACY_KEY : USER_LEGACY_KEY;
        return allowedTheme(localStorage.getItem(primaryKey) || localStorage.getItem(legacyKey) || "light", workerPage);
    }

    function applySavedTheme() {
        if (!document.body) return;
        const workerPage = document.body.classList.contains("worker-page");
        const color = localStorage.getItem(workerPage ? "workerGlassColorV2" : "smartComplaintGlassColor") || "blue";
        applyGlobalColor(color);
        applyTheme(savedTheme(workerPage), workerPage);
    }

    function setUserTheme(theme) {
        theme = allowedTheme(theme, false);
        localStorage.setItem(USER_KEY, theme);
        localStorage.setItem(USER_LEGACY_KEY, theme);
        applyTheme(theme, false);
        return theme;
    }

    function setWorkerTheme(theme) {
        theme = allowedTheme(theme, true);
        localStorage.setItem(WORKER_KEY, theme);
        localStorage.setItem(WORKER_LEGACY_KEY, theme);
        applyTheme(theme, true);
        return theme;
    }

    window.SmartComplaintTheme = {
        themes: THEMES.slice(),
        freeThemes: FREE_THEMES.slice(),
        premiumThemes: PREMIUM_THEMES.slice(),
        validTheme: validTheme,
        isPremiumTheme: isPremiumTheme,
        hasUserPremiumAccess: function(){ return hasPremiumAccess(false); },
        hasWorkerPremiumAccess: function(){ return hasPremiumAccess(true); },
        setUserPremiumAccess: function(enabled){ return setPremiumAccess(false, !!enabled); },
        setWorkerPremiumAccess: function(enabled){ return setPremiumAccess(true, !!enabled); },
        applySavedTheme: applySavedTheme,
        applyGlobalColor: applyGlobalColor,
        setUserTheme: setUserTheme,
        setWorkerTheme: setWorkerTheme,
        getUserTheme: function(){ return savedTheme(false); },
        getWorkerTheme: function(){ return savedTheme(true); }
    };

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", applySavedTheme);
    else applySavedTheme();
})();
</script>
