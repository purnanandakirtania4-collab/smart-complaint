<style>
  :root{
    --cx-navy:#102457;--cx-text:#243552;--cx-muted:#6b7c94;--cx-line:#d8e5f2;
    --cx-bg:#eef5ff;--cx-card:#fff;--cx-blue:#1f7cf2;--cx-sky:#2aa8f5;
    --cx-green:#0aa777;--cx-red:#dc2626;--cx-yellow:#f59e0b;
    --cx-shadow:0 16px 40px rgba(31,68,122,.09)
  }
  *{box-sizing:border-box}
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  body{margin:0;background:var(--cx-bg);color:var(--cx-text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  a{color:inherit}
  .cx-page{width:min(1120px,calc(100% - 18px));margin:0 auto;padding:18px 0 110px}
  .cx-topbar{position:sticky;top:6px;z-index:100;width:min(1120px,calc(100% - 18px));margin:calc(6px + env(safe-area-inset-top,0px)) auto 14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--cx-line);border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 12px 32px rgba(31,70,126,.1);backdrop-filter:blur(18px)}
  .cx-brand{display:flex;align-items:center;gap:10px;min-width:0}.cx-brand-mark{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--cx-blue),var(--cx-green));font-weight:950}.cx-brand h1{margin:0;color:var(--cx-navy);font-size:16px;line-height:1.1}.cx-brand p{margin:3px 0 0;color:var(--cx-muted);font-size:9px}
  .cx-btn{min-height:40px;padding:9px 13px;border:0;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font:inherit;font-size:10px;font-weight:900;cursor:pointer}.cx-btn-primary{color:#fff;background:linear-gradient(135deg,var(--cx-blue),var(--cx-sky))}.cx-btn-soft{color:var(--cx-navy);background:#fff;border:1px solid #cbdbea}.cx-btn-green{color:#fff;background:linear-gradient(135deg,var(--cx-green),#20c894)}.cx-btn-danger{color:#b91c1c;background:#fff1f2;border:1px solid #fecdd3}
  .cx-hero,.cx-card{border:1px solid var(--cx-line);border-radius:20px;background:#fff;box-shadow:var(--cx-shadow)}.cx-hero{padding:24px;background:radial-gradient(circle at 93% 8%,rgba(42,168,245,.15),transparent 31%),radial-gradient(circle at 4% 105%,rgba(10,167,119,.11),transparent 34%),#fff}.cx-hero h2{margin:0;color:var(--cx-navy);font-size:clamp(27px,5vw,44px);line-height:1.04;letter-spacing:-.035em}.cx-hero p{max-width:780px;margin:11px 0 0;color:var(--cx-muted);font-size:12px;line-height:1.65}
  .cx-kicker{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:6px 10px;border:1px solid #cfe9df;border-radius:999px;background:#f0fbf7;color:#13775a;font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.04em}
  .cx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:14px}.cx-grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.cx-card{padding:16px}.cx-card h3{margin:0;color:var(--cx-navy);font-size:15px}.cx-card p{margin:7px 0 0;color:var(--cx-muted);font-size:10px;line-height:1.55}.cx-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
  .cx-search{display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,.35fr) auto;gap:9px;margin-top:14px;padding:13px;border:1px solid var(--cx-line);border-radius:17px;background:#fff}.cx-input,.cx-select,.cx-textarea{width:100%;min-height:43px;padding:9px 11px;border:1px solid #cbdbea;border-radius:11px;outline:0;background:#fbfdff;color:var(--cx-text);font:inherit;font-size:11px;font-weight:700}.cx-textarea{min-height:110px;resize:vertical}.cx-input:focus,.cx-select:focus,.cx-textarea:focus{border-color:var(--cx-blue);box-shadow:0 0 0 3px rgba(31,124,242,.1)}
  .cx-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.cx-field{display:grid;gap:5px}.cx-field-full{grid-column:1/-1}.cx-label{color:#526985;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}.cx-help{color:#8493a7;font-size:8px;line-height:1.4}
  .cx-message{margin-bottom:10px;padding:10px 12px;border:1px solid #dbeafe;border-radius:12px;background:#eff6ff;color:#1e4f91;font-size:10px;font-weight:800}.cx-message.error{border-color:#fecaca;background:#fff1f2;color:#b91c1c}.cx-message.success{border-color:#bbf7d0;background:#f0fdf4;color:#166534}.cx-message.warning{border-color:#fde68a;background:#fffbeb;color:#92400e}
  .cx-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.cx-chip{padding:5px 8px;border-radius:999px;background:#f1f5f9;color:#53657d;font-size:8px;font-weight:900}.cx-chip-green{background:#ecfdf5;color:#08765a}.cx-chip-blue{background:#eff6ff;color:#1d4ed8}
  .cx-empty{padding:34px 16px;border:1px dashed #cbdbea;border-radius:16px;background:#fff;text-align:center;color:var(--cx-muted);font-size:10px}.cx-empty strong{display:block;color:var(--cx-navy);font-size:14px;margin-bottom:4px}
  .cx-list{display:grid;gap:10px;margin-top:14px}.cx-row{padding:14px;border:1px solid var(--cx-line);border-radius:16px;background:#fff;box-shadow:0 8px 22px rgba(31,68,122,.05)}.cx-row-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.cx-row h3{margin:0;color:var(--cx-navy);font-size:14px}.cx-row p{margin:6px 0 0;color:var(--cx-muted);font-size:10px;line-height:1.5}
  @media(max-width:800px){.cx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cx-search{grid-template-columns:1fr}.cx-form{grid-template-columns:1fr}.cx-field-full{grid-column:auto}}
  @media(max-width:560px){.cx-page,.cx-topbar{width:min(100% - 12px,1120px)}.cx-grid,.cx-grid-2{grid-template-columns:1fr}.cx-hero{padding:18px}.cx-topbar{border-radius:15px}.cx-brand p{display:none}}
</style>
