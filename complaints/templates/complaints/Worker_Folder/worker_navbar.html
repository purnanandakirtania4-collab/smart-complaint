{% load static %}

<style>
    :root {
        --worker-glass-rgb: 37, 99, 235;
        --worker-glass-rgb-2: 79, 70, 229;
    }

    * {
        box-sizing: border-box;
    }

    /* =====================================================
       TOPBAR
    ===================================================== */

    .worker-topbar {
        position: fixed;

        top: 0;
        left: 0;
        right: 0;

        height: 64px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 20px;

        background: #ffffff;

        box-shadow:
            0 2px 12px
            rgba(0, 0, 0, 0.12);

        z-index: 9998;

        transition:
            background 0.25s ease,
            border-color 0.25s ease;
    }

    .worker-menu-btn {
        width: 42px;
        height: 42px;

        border: none;
        border-radius: 11px;

        background: #f1f5f9;

        color: #0f172a;

        cursor: pointer;

        font-size: 24px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-family: inherit;
    }

    .worker-topbar-title {
        font-size: 18px;
        font-weight: 800;

        color: #0f172a;
    }

    .worker-topbar-name {
        font-size: 14px;
        font-weight: 700;

        color: #475569;
    }

    /* =====================================================
       OVERLAY
    ===================================================== */

    .worker-sidebar-overlay {
        position: fixed;

        inset: 0;

        background:
            rgba(15, 23, 42, 0.55);

        z-index: 9999;

        opacity: 0;
        visibility: hidden;

        transition: 0.3s ease;
    }

    .worker-sidebar-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    /* =====================================================
       SIDEBAR
    ===================================================== */

    .worker-sidebar {
        position: fixed;

        top: 0;
        left: -310px;

        width: 285px;
        max-width: 88vw;

        height: 100vh;

        background: #ffffff;

        z-index: 10000;

        box-shadow:
            5px 0 25px
            rgba(0, 0, 0, 0.18);

        transition:
            left 0.32s ease,
            background 0.25s ease;

        overflow-y: auto;
    }

    .worker-sidebar.active {
        left: 0;
    }

    .worker-sidebar-header {
        padding: 28px 20px 22px;

        background:
            linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

        color: #ffffff;
    }

    .worker-sidebar-header h2 {
        margin: 0 0 6px;
        font-size: 21px;
    }

    .worker-sidebar-header p {
        margin: 0;
        font-size: 13px;
        opacity: 0.9;
    }

    .worker-sidebar-menu {
        padding: 18px 12px 24px;
    }

    /* =====================================================
       LINKS
    ===================================================== */

    .worker-nav-link,
    .worker-appearance-button {
        width: 100%;

        min-height: 50px;

        display: flex;
        align-items: center;

        gap: 14px;

        padding: 12px 15px;

        margin-bottom: 7px;

        border: 1px solid transparent;
        border-radius: 11px;

        background: transparent;

        color: #1e293b;

        text-decoration: none;

        font-size: 15px;
        font-weight: 600;

        cursor: pointer;

        text-align: left;

        font-family: inherit;

        transition:
            background 0.2s ease,
            color 0.2s ease,
            transform 0.2s ease;
    }

    .worker-nav-link:hover,
    .worker-appearance-button:hover {
        background: #eff6ff;
        color: #2563eb;

        transform: translateX(3px);
    }

    .worker-nav-icon {
        width: 28px;
        text-align: center;
        font-size: 20px;
    }

    .worker-logout-link {
        color: #dc2626;
    }

    .worker-logout-link:hover {
        color: #dc2626;
        background: #fef2f2;
    }

    .worker-divider {
        height: 1px;
        background: #e2e8f0;
        margin: 12px 5px;
    }

    /* =====================================================
       APPEARANCE
    ===================================================== */

    .worker-appearance-panel {
        display: none;

        margin:
            0 0 12px;

        padding: 14px;

        border:
            1px solid #e2e8f0;

        border-radius: 15px;

        background: #f8fafc;
    }

    .worker-appearance-panel.open {
        display: block;
    }

    .worker-appearance-title {
        margin-bottom: 10px;

        font-size: 13px;
        font-weight: 800;

        color: #475569;
    }

    .worker-theme-options {
        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 7px;
    }

    .worker-theme-option {
        padding: 9px 5px;

        border:
            1px solid #cbd5e1;

        border-radius: 10px;

        background: #ffffff;

        color: #475569;

        font-size: 12px;
        font-weight: 800;

        font-family: inherit;

        cursor: pointer;
    }

    .worker-theme-option.active {
        background: #2563eb;
        border-color: #2563eb;

        color: #ffffff;
    }

    .worker-glass-colors {
        display: none;

        margin-top: 14px;
    }

    .worker-glass-colors.show {
        display: block;
    }

    .worker-glass-color-title {
        margin-bottom: 9px;

        font-size: 12px;
        font-weight: 800;

        color: #64748b;
    }

    .worker-color-options {
        display: flex;
        gap: 10px;

        flex-wrap: wrap;
    }

    .worker-color-option {
        width: 30px;
        height: 30px;

        border:
            3px solid transparent;

        border-radius: 50%;

        cursor: pointer;

        padding: 0;
    }

    .worker-color-option.active {
        border-color: #ffffff;
        outline: 2px solid #0f172a;
    }

    .worker-color-blue {
        background: #2563eb;
    }

    .worker-color-indigo {
        background: #4f46e5;
    }

    .worker-color-teal {
        background: #0f766e;
    }

    .worker-color-purple {
        background: #7c3aed;
    }

    .worker-color-slate {
        background: #475569;
    }

    /* =====================================================
       DARK
    ===================================================== */

    body.worker-theme-dark {
        background: #0f172a !important;
        color: #e2e8f0 !important;
    }

    body.worker-theme-dark .worker-topbar {
        background: #1e293b;
    }

    body.worker-theme-dark
    .worker-topbar-title,
    body.worker-theme-dark
    .worker-topbar-name {
        color: #ffffff;
    }

    body.worker-theme-dark
    .worker-menu-btn {
        background: #334155;
        color: #ffffff;
    }

    body.worker-theme-dark
    .worker-sidebar {
        background: #1e293b;
    }

    body.worker-theme-dark
    .worker-nav-link,
    body.worker-theme-dark
    .worker-appearance-button {
        color: #e2e8f0;
    }

    body.worker-theme-dark
    .worker-nav-link:hover,
    body.worker-theme-dark
    .worker-appearance-button:hover {
        background: #334155;
        color: #60a5fa;
    }

    body.worker-theme-dark
    .worker-appearance-panel {
        background: #0f172a;
        border-color: #475569;
    }

    body.worker-theme-dark
    .worker-appearance-title,
    body.worker-theme-dark
    .worker-glass-color-title {
        color: #cbd5e1;
    }

    body.worker-theme-dark
    .worker-theme-option {
        background: #1e293b;
        border-color: #475569;
        color: #cbd5e1;
    }

    body.worker-theme-dark
    .worker-theme-option.active {
        background: #2563eb;
        color: #ffffff;
    }

    /* =====================================================
       GLASS
    ===================================================== */

    body.worker-theme-glass {
        background:
            radial-gradient(
                circle at 15% 15%,
                rgba(var(--worker-glass-rgb), 0.45),
                transparent 35%
            ),
            radial-gradient(
                circle at 85% 85%,
                rgba(var(--worker-glass-rgb-2), 0.32),
                transparent 40%
            ),
            linear-gradient(
                135deg,
                #0f172a,
                #172554,
                #1e293b
            ) !important;

        background-attachment: fixed !important;

        color: #ffffff;
    }

    body.worker-theme-glass
    .worker-topbar {
        background:
            rgba(var(--worker-glass-rgb), 0.15);

        border-bottom:
            1px solid
            rgba(255, 255, 255, 0.18);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
    }

    body.worker-theme-glass
    .worker-menu-btn {
        background:
            rgba(255, 255, 255, 0.10);

        border:
            1px solid
            rgba(255, 255, 255, 0.18);

        color: #ffffff;

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    body.worker-theme-glass
    .worker-topbar-title,
    body.worker-theme-glass
    .worker-topbar-name {
        color: #ffffff;
    }

    body.worker-theme-glass
    .worker-sidebar {
        background:
            linear-gradient(
                180deg,
                rgba(var(--worker-glass-rgb), 0.20),
                rgba(15, 23, 42, 0.25)
            );

        border-right:
            1px solid
            rgba(255, 255, 255, 0.18);

        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
    }

    body.worker-theme-glass
    .worker-sidebar-header {
        background:
            linear-gradient(
                135deg,
                rgba(var(--worker-glass-rgb), 0.42),
                rgba(var(--worker-glass-rgb-2), 0.22)
            );
    }

    body.worker-theme-glass
    .worker-nav-link,
    body.worker-theme-glass
    .worker-appearance-button {
        background:
            rgba(255, 255, 255, 0.07);

        border-color:
            rgba(255, 255, 255, 0.10);

        color: #ffffff;

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    body.worker-theme-glass
    .worker-nav-link:hover,
    body.worker-theme-glass
    .worker-appearance-button:hover {
        background:
            rgba(var(--worker-glass-rgb), 0.24);

        border-color:
            rgba(255, 255, 255, 0.22);

        color: #ffffff;
    }

    body.worker-theme-glass
    .worker-appearance-panel {
        background:
            rgba(255, 255, 255, 0.07);

        border-color:
            rgba(255, 255, 255, 0.14);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
    }

    body.worker-theme-glass
    .worker-appearance-title,
    body.worker-theme-glass
    .worker-glass-color-title {
        color:
            rgba(255, 255, 255, 0.82);
    }

    body.worker-theme-glass
    .worker-theme-option {
        background:
            rgba(255, 255, 255, 0.08);

        border-color:
            rgba(255, 255, 255, 0.14);

        color: #ffffff;
    }

    body.worker-theme-glass
    .worker-theme-option.active {
        background:
            rgba(var(--worker-glass-rgb), 0.75);
    }

    body.worker-theme-glass
    .worker-logout-link {
        color: #fecaca;
    }

    /* =====================================================
       CONTENT OFFSET
    ===================================================== */

    body {
        padding-top: 64px;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

        .worker-topbar {
            padding: 0 12px;
        }

        .worker-topbar-title {
            font-size: 15px;
        }

        .worker-topbar-name {
            display: none;
        }

        .worker-sidebar {
            width: 280px;
        }
    }
</style>


<div class="worker-topbar">

    <button
        type="button"
        class="worker-menu-btn"
        id="workerMenuButton"
        aria-label="Open worker menu"
    >
        ☰
    </button>

    <div class="worker-topbar-title">
        Smart Complaint - Worker
    </div>

    <div class="worker-topbar-name">
        {{ worker.name|default:request.user.username }}
    </div>

</div>


<div
    class="worker-sidebar-overlay"
    id="workerSidebarOverlay"
></div>


<aside
    class="worker-sidebar"
    id="workerSidebar"
>

    <div class="worker-sidebar-header">

        <h2>
            👷 Worker Panel
        </h2>

        <p>
            {{ worker.name|default:request.user.username }}
        </p>

    </div>


    <div class="worker-sidebar-menu">

        {% if worker %}

            <a
                href="{% url 'worker_profile' worker.id %}"
                class="worker-nav-link"
            >
                <span class="worker-nav-icon">
                    👤
                </span>

                <span>
                    Profile
                </span>
            </a>

        {% endif %}


        <a
            href="{% url 'terms_conditions' %}"
            class="worker-nav-link"
        >
            <span class="worker-nav-icon">
                💳
            </span>

            <span>
                Subscription
            </span>
        </a>


        <a
            href="{% url 'worker_settings' %}"
            class="worker-nav-link"
        >
            <span class="worker-nav-icon">
                ⚙️
            </span>

            <span>
                Settings
            </span>
        </a>


        <!-- APPEARANCE -->

        <button
            type="button"
            class="worker-appearance-button"
            id="workerAppearanceButton"
        >
            <span class="worker-nav-icon">
                🎨
            </span>

            <span>
                Appearance
            </span>
        </button>


        <div
            class="worker-appearance-panel"
            id="workerAppearancePanel"
        >

            <div class="worker-appearance-title">
                Choose Theme
            </div>


            <div class="worker-theme-options">

                <button
                    type="button"
                    class="worker-theme-option"
                    data-worker-theme="light"
                >
                    Light
                </button>

                <button
                    type="button"
                    class="worker-theme-option"
                    data-worker-theme="dark"
                >
                    Dark
                </button>

                <button
                    type="button"
                    class="worker-theme-option"
                    data-worker-theme="glass"
                >
                    Glass
                </button>

            </div>


            <div
                class="worker-glass-colors"
                id="workerGlassColors"
            >

                <div class="worker-glass-color-title">
                    Glass Color
                </div>


                <div class="worker-color-options">

                    <button
                        type="button"
                        class="worker-color-option worker-color-blue"
                        data-worker-color="blue"
                        title="Blue"
                    ></button>

                    <button
                        type="button"
                        class="worker-color-option worker-color-indigo"
                        data-worker-color="indigo"
                        title="Indigo"
                    ></button>

                    <button
                        type="button"
                        class="worker-color-option worker-color-teal"
                        data-worker-color="teal"
                        title="Teal"
                    ></button>

                    <button
                        type="button"
                        class="worker-color-option worker-color-purple"
                        data-worker-color="purple"
                        title="Purple"
                    ></button>

                    <button
                        type="button"
                        class="worker-color-option worker-color-slate"
                        data-worker-color="slate"
                        title="Slate"
                    ></button>

                </div>

            </div>

        </div>


        <div class="worker-divider"></div>


        <a
            href="{% url 'worker_logout' %}"
            class="worker-nav-link worker-logout-link"
        >
            <span class="worker-nav-icon">
                🚪
            </span>

            <span>
                Logout
            </span>
        </a>

    </div>

</aside>


<script>
    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const menuButton =
                document.getElementById(
                    "workerMenuButton"
                );

            const sidebar =
                document.getElementById(
                    "workerSidebar"
                );

            const overlay =
                document.getElementById(
                    "workerSidebarOverlay"
                );

            const appearanceButton =
                document.getElementById(
                    "workerAppearanceButton"
                );

            const appearancePanel =
                document.getElementById(
                    "workerAppearancePanel"
                );

            const glassColors =
                document.getElementById(
                    "workerGlassColors"
                );

            const themeButtons =
                document.querySelectorAll(
                    ".worker-theme-option"
                );

            const colorButtons =
                document.querySelectorAll(
                    ".worker-color-option"
                );


            const glassColorMap = {

                blue: {
                    primary: "37, 99, 235",
                    secondary: "59, 130, 246"
                },

                indigo: {
                    primary: "79, 70, 229",
                    secondary: "99, 102, 241"
                },

                teal: {
                    primary: "15, 118, 110",
                    secondary: "20, 184, 166"
                },

                purple: {
                    primary: "124, 58, 237",
                    secondary: "147, 51, 234"
                },

                slate: {
                    primary: "71, 85, 105",
                    secondary: "100, 116, 139"
                }

            };


            function openMenu() {

                sidebar.classList.add(
                    "active"
                );

                overlay.classList.add(
                    "active"
                );

                document.body.style.overflow =
                    "hidden";
            }


            function closeMenu() {

                sidebar.classList.remove(
                    "active"
                );

                overlay.classList.remove(
                    "active"
                );

                document.body.style.overflow =
                    "";
            }


            function setWorkerGlassColor(
                color
            ) {

                const selected =
                    glassColorMap[color] ||
                    glassColorMap.blue;


                document.documentElement.style.setProperty(
                    "--worker-glass-rgb",
                    selected.primary
                );


                document.documentElement.style.setProperty(
                    "--worker-glass-rgb-2",
                    selected.secondary
                );


                colorButtons.forEach(
                    function (button) {

                        button.classList.toggle(
                            "active",
                            button.dataset.workerColor === color
                        );
                    }
                );


                localStorage.setItem(
                    "workerGlassColorV2",
                    color
                );
            }


            function setWorkerTheme(
                theme
            ) {

                document.body.classList.remove(
                    "worker-theme-light",
                    "worker-theme-dark",
                    "worker-theme-glass",
                    "worker-dark-mode"
                );


                if (
                    theme === "dark"
                ) {

                    document.body.classList.add(
                        "worker-theme-dark"
                    );

                }

                else if (
                    theme === "glass"
                ) {

                    document.body.classList.add(
                        "worker-theme-glass"
                    );

                }

                else {

                    theme = "light";

                    document.body.classList.add(
                        "worker-theme-light"
                    );
                }


                themeButtons.forEach(
                    function (button) {

                        button.classList.toggle(
                            "active",
                            button.dataset.workerTheme === theme
                        );
                    }
                );


                glassColors.classList.toggle(
                    "show",
                    theme === "glass"
                );


                localStorage.setItem(
                    "workerThemeV2",
                    theme
                );
            }


            menuButton.addEventListener(
                "click",
                openMenu
            );


            overlay.addEventListener(
                "click",
                closeMenu
            );


            appearanceButton.addEventListener(
                "click",
                function () {

                    appearancePanel.classList.toggle(
                        "open"
                    );
                }
            );


            themeButtons.forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            setWorkerTheme(
                                this.dataset.workerTheme
                            );
                        }
                    );
                }
            );


            colorButtons.forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            setWorkerGlassColor(
                                this.dataset.workerColor
                            );


                            setWorkerTheme(
                                "glass"
                            );
                        }
                    );
                }
            );


            const savedTheme =
                localStorage.getItem(
                    "workerThemeV2"
                ) || "light";


            const savedColor =
                localStorage.getItem(
                    "workerGlassColorV2"
                ) || "blue";


            setWorkerGlassColor(
                savedColor
            );


            setWorkerTheme(
                savedTheme
            );


            document.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Escape" &&
                        sidebar.classList.contains(
                            "active"
                        )
                    ) {

                        closeMenu();
                    }
                }
            );

        }
    );
</script>
