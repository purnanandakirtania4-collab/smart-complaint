<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Worker Login | Smart Complaint</title>

    {% include 'complaints/base_style.html' %}

    <style>
      .box {
        max-width: 430px;
        margin: 70px auto;
        padding: 35px;
      }
      
      .head {
        text-align: center;
      }
      
      .icon {
        width: 78px;
        height: 78px;
        margin: auto;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 38px;
      }
      
      .head h1 {
        margin: 14px 0 7px;
      }
      
      .link {
        text-align: center;
        margin-top: 20px;
      }
      
      .worker-link {
        color: #2563eb;
        font-weight: 900;
      }
      
      .user-link {
        color: #64748b;
        font-weight: 700;
      }
      
      body.worker-theme-dark .icon {
        background: #1e3a5f;
      }
      
      body.worker-theme-dark .worker-link {
        color: #93c5fd;
      }
      
      body.worker-theme-dark .user-link {
        color: #cbd5e1;
      }
      
      body.worker-theme-glass .box {
        background: linear-gradient(135deg, rgba(96, 165, 250, 0.13), rgba(255, 255, 255, 0.075), rgba(99, 102, 241, 0.08)) !important;
        border: 1px solid rgba(191, 219, 254, 0.27) !important;
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
      }
      
      body.worker-theme-glass .icon {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ffffff;
      }
      
      body.worker-theme-glass .worker-link {
        color: #bfdbfe;
      }
      
      body.worker-theme-glass .user-link {
        color: rgba(219, 234, 254, 0.78);
      }
      
      @media (max-width: 600px) {
        .box {
          margin: 35px auto;
          padding: 25px 18px;
        }
      }
    </style>
  </head>

  <body class="worker-page">
    <main class="page">
      <div class="card box">
        <div class="head">
          <div class="icon">👷</div>
          <h1>Worker Login</h1>
          <p class="muted">Access your assigned complaint dashboard.</p>
        </div>

        {% if messages %}
          {% for message in messages %}
            <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <form method="post" style="margin-top:25px;">
          {% csrf_token %}

          <div class="form-group">
            <label class="label">Username</label>
            <input class="input" name="username" required autocomplete="username" />
          </div>

          <div class="form-group">
            <label class="label">Password</label>
            <input class="input" type="password" name="password" required autocomplete="current-password" />
          </div>

          <button class="btn btn-primary" type="submit" style="width:100%;">🔐 Login to Dashboard</button>
        </form>

        <div class="link">
          <span class="muted">New worker?</span>
          <a href="{% url 'worker_register' %}" class="worker-link">Create Worker Account</a>
        </div>

        <div class="link">
          <a href="{% url 'login' %}" class="user-link">← User Login</a>
        </div>
      </div>
    </main>
  </body>
</html>
