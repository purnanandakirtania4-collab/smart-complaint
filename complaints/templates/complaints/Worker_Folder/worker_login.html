<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Worker Login | Smart Complaint</title>

    {% include 'complaints/base_style.html' %}

    <style>
      * {
        box-sizing: border-box;
      }
      
      .worker-auth-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      
      .worker-login-card {
        width: min(440px, 100%);
        padding: 34px;
        border-radius: 26px;
      }
      
      .ui-icon {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      
      .head {
        text-align: center;
      }
      
      .worker-icon {
        width: 76px;
        height: 76px;
        margin: 0 auto 14px;
        display: grid;
        place-items: center;
        border-radius: 22px;
      }
      
      .worker-icon .ui-icon {
        width: 38px;
        height: 38px;
      }
      
      .head h1 {
        margin: 0 0 7px;
        font-size: 29px;
      }
      .head p {
        margin: 0 0 24px;
      }
      
      .password-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      
      .forgot-link {
        font-size: 12px;
        font-weight: 900;
        text-decoration: none;
      }
      
      .login-btn {
        width: 100%;
      }
      
      .footer-link {
        text-align: center;
        margin-top: 19px;
        font-size: 14px;
      }
      
      .footer-link a {
        font-weight: 900;
      }
      
      body.worker-theme-light .worker-login-card {
        background: #fff;
        border: 1px solid #e2e8f0;
        color: #172554;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
      }
      body.worker-theme-light .worker-icon {
        background: #dbeafe;
        color: #1d4ed8;
      }
      body.worker-theme-light .forgot-link,
      body.worker-theme-light .footer-link a {
        color: #2563eb;
      }
      
      body.worker-theme-dark .worker-login-card {
        background: #1e293b;
        border: 1px solid #334155;
        color: #f8fafc;
        box-shadow: 0 26px 65px rgba(2, 6, 23, 0.42);
      }
      body.worker-theme-dark .worker-icon {
        background: #334155;
        color: #bfdbfe;
      }
      body.worker-theme-dark .forgot-link,
      body.worker-theme-dark .footer-link a {
        color: #93c5fd;
      }
      
      body.worker-theme-glass .worker-login-card {
        background: linear-gradient(135deg, rgba(96, 165, 250, 0.14), rgba(255, 255, 255, 0.075), rgba(99, 102, 241, 0.08));
        border: 1px solid rgba(191, 219, 254, 0.28);
        color: #fff;
        box-shadow: 0 30px 75px rgba(2, 6, 23, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
      }
      body.worker-theme-glass .worker-icon {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      body.worker-theme-glass .forgot-link,
      body.worker-theme-glass .footer-link a {
        color: #bfdbfe;
      }
      
      @media (max-width: 600px) {
        .worker-auth-page {
          padding: 14px;
          align-items: flex-start;
        }
        .worker-login-card {
          margin-top: 20px;
          padding: 25px 19px;
          border-radius: 22px;
        }
        body.worker-theme-glass .worker-login-card {
          backdrop-filter: blur(18px);
          -webkit-backdrop-filter: blur(18px);
        }
      }
    </style>
  </head>

  <body class="worker-page">
    <main class="worker-auth-page">
      <section class="worker-login-card">
        <div class="theme-choice-bar">
          <button type="button" class="theme-choice-btn" onclick="setWorkerTheme('light')">Light</button>
          <button type="button" class="theme-choice-btn" onclick="setWorkerTheme('dark')">Dark</button>
          <button type="button" class="theme-choice-btn" onclick="setWorkerTheme('glass')">Glass</button>
        </div>

        <div class="head">
          <div class="worker-icon">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
              <path d="M8 4h8"></path>
            </svg>
          </div>
          <h1>Worker Login</h1>
          <p class="muted">Access your assigned complaint dashboard.</p>
        </div>

        {% if messages %}
          {% for message in messages %}
            <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="form-group">
            <label class="label" for="workerUsername">Username</label>
            <input class="input" id="workerUsername" name="username" required autocomplete="username" />
          </div>

          <div class="form-group">
            <div class="password-head">
              <label class="label" for="workerPassword">Password</label>
              <a href="{% url 'password_reset' %}" class="forgot-link">Forgot Password?</a>
            </div>
            <input class="input" id="workerPassword" type="password" name="password" required autocomplete="current-password" />
          </div>

          <button class="btn btn-primary login-btn" type="submit">
            <svg class="ui-icon" viewBox="0 0 24 24">
              <path d="M10 17l5-5-5-5"></path>
              <path d="M15 12H3"></path>
              <path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"></path>
            </svg>Login to Dashboard
          </button>
        </form>

        <div class="footer-link">
          <span class="muted">New worker?</span>
          <a href="{% url 'worker_register' %}">Create Worker Account</a>
        </div>

        <div class="footer-link">
          <a href="{% url 'login' %}">← User Login</a>
        </div>
      </section>
    </main>

    <script>
      function setWorkerTheme(theme) {
        if (window.SmartComplaintTheme && window.SmartComplaintTheme.setWorkerTheme) {
          window.SmartComplaintTheme.setWorkerTheme(theme)
        }
      }
    </script>
  </body>
</html>
